name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q ai-video-rebrander.zip

      - name: Patch project for SDK 36
        working-directory: ai-video-rebrander
        run: |
          sed -i 's/version "8.5.2"/version "8.8.2"/' build.gradle.kts
          sed -i 's/version "2.0.21"/version "2.2.10"/g' build.gradle.kts
          sed -i 's/compileSdk = 34/compileSdk = 36/' app/build.gradle.kts
          sed -i 's/targetSdk = 34/targetSdk = 36/' app/build.gradle.kts
          sed -i 's|id("org.jetbrains.kotlin.plugin.compose") version "2.2.10" apply false|id("org.jetbrains.kotlin.plugin.compose") version "2.2.10" apply false\n    id("org.jetbrains.kotlin.plugin.parcelize") version "2.2.10" apply false|' build.gradle.kts
          grep -E "8.8.2|parcelize|2.2.10" build.gradle.kts
          grep -E "compileSdk|targetSdk" app/build.gradle.kts | head -3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.10
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: ai-video-rebrander
        run: gradle assembleDebug --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-rebrander-apk
          path: ai-video-rebrander/app/build/outputs/apk/debug/app-debug.apk
